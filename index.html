<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porta-comprimidos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Remédios">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="estilo.css?v=4">
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <span class="eyebrow" id="hoje-data">—</span>
    <nav class="abas" role="tablist">
      <button role="tab" data-aba="hoje" aria-selected="true">Hoje</button>
      <button role="tab" data-aba="itens" aria-selected="false">Remédios</button>
      <button role="tab" data-aba="ajustes" aria-selected="false">Ajustes</button>
    </nav>
  </div>
<div class="pendente" id="pendente" hidden>
  <div class="pendente-in">
    <span id="pendente-txt">Alterações ainda não enviadas ao Calendário.</span>
    <div class="pendente-acoes">
      <button class="btn ghost" id="btn-descartar">Desfazer</button>
      <button class="btn" id="btn-confirmar">Confirmar</button>
    </div>
  </div>
</div>
</header>

<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js?v=4"></script>
</body>
</html>
